<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Agent Scorecard — Review &amp; Comment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --serif:"Source Serif 4",Charter,Georgia,serif;
    --sans:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","Courier New",monospace;
    --ink:#1b1b1b; --muted:#6b6b6b; --line:#e4e4e0; --bg:#f6f5f1; --paper:#fff;
    --hl:#ffe9a6; --hlActive:#ffd54a; --accent:#262d65; --red:#b23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
  /* top bar */
  .bar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);
       border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
       padding:10px 20px;font-family:var(--sans)}
  .bar .t{font-weight:700;font-size:15px;color:var(--accent)}
  .bar .sp{flex:1}
  .bar .count{font-size:13px;color:var(--muted)}
  .bar button{font-family:var(--sans);font-size:13px;border:1px solid var(--line);background:#fff;
       color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer}
  .bar button:hover{background:#f0f0ec;border-color:#cfcfca}
  .bar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar button.primary:hover{background:#1c2250}
  .hint{font-family:var(--sans);font-size:12.5px;color:var(--muted);padding:8px 20px;background:#fbfbf8;border-bottom:1px solid var(--line)}
  .hint b{color:#333}
  /* layout */
  html{scroll-behavior:smooth}
  :root{--bar:52px}
  .wrap{max-width:none;margin:0;padding:0}
  .doc{display:grid;grid-template-columns:280px minmax(0,1fr) 280px;gap:24px;align-items:start}
  #content{background:var(--paper);border:1px solid var(--line);border-radius:10px;
       padding:48px 56px;margin:28px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  #rail{position:relative;margin:28px 0}
  /* left table of contents */
  #toc{position:sticky;top:calc(var(--bar) + 10px);align-self:start;margin:28px 0;
       max-height:calc(100vh - var(--bar) - 22px);overflow-y:auto;overflow-x:hidden;
       font-family:var(--sans);font-size:14.5px;line-height:1.4;padding-left:15px;padding-right:4px}
  #toc .toc-h{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px;padding-left:4px}
  #toc a{display:block;color:#5a5a5a;text-decoration:none;padding:3px 8px 3px 4px;border-left:2px solid transparent;border-radius:0 5px 5px 0}
  #toc a:hover{color:var(--accent);background:#f0f0ec}
  #toc a.lvl1{font-weight:700;color:var(--accent);margin-top:10px}
  #toc a.lvl2{font-weight:600;color:#333}
  #toc a.lvl3{padding-left:16px;color:#6b6b6b;font-size:13.5px}
  #toc a.active{border-left-color:var(--accent);background:#eef0f6;color:var(--accent)}
  /* let hash jumps and scrollIntoView clear the sticky top bar */
  #content h1,#content h2,#content h3{scroll-margin-top:calc(var(--bar) + 14px)}
  /* typography inside content */
  #content h1,#content h2,#content h3,#content h4{font-family:var(--sans);color:#111;line-height:1.2}
  #content h1{font-size:30px;font-weight:700;letter-spacing:-.015em;margin:.2em 0 .5em}
  #content h1:not(:first-of-type){border-bottom:2px solid #111;padding-bottom:8px;margin-top:1.4em;color:var(--accent)}
  #content h2{font-size:22px;margin:1.5em 0 .35em}
  #content h3{font-size:17px;font-weight:600;margin:1.3em 0 .2em}
  #content p{margin:0 0 .72em}
  #content a{color:var(--accent);text-decoration:none}
  #content strong{font-weight:600}
  #content ul,#content ol{margin:0 0 .72em;padding-left:1.4em}
  #content li{margin:0 0 .3em}
  #content blockquote{margin:.7em 0;padding-left:14px;border-left:2px solid #c7c7c7;color:#3a3a3a;font-style:italic}
  #content code{font-family:var(--mono);font-size:.82em;background:#f3f3f1;padding:0 3px;border-radius:3px}
  /* code samples: VS Code Light theme, white bg, smaller, wrapped (no horizontal scroll) */
  #content pre{background:#fff;border:1px solid #d7d7d2;border-radius:6px;padding:11px 13px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  #content pre code{background:none;padding:0;font-family:var(--mono);font-size:12px;line-height:1.5;color:#000;white-space:pre-wrap}
  #content div.sourceCode{overflow:visible;margin:0 0 14px}
  #content pre.sourceCode{background:#fff}
  #content code span.co,#content code span.cv,#content code span.do{color:#008000}
  #content code span.kw,#content code span.im{color:#0000ff}
  #content code span.cf{color:#af00db}
  #content code span.st,#content code span.ch,#content code span.sc,#content code span.ss,#content code span.vs{color:#a31515}
  #content code span.dv,#content code span.fl,#content code span.bn,#content code span.cn{color:#098658}
  #content code span.fu{color:#795e26}
  #content code span.dt,#content code span.bu,#content code span.at{color:#267f99}
  #content code span.va{color:#001080}
  #content code span.op{color:#000}
  #content code span.er{color:#cd3131}
  /* "What you will learn" callout */
  #content .learnbox{border:1px solid #c7ccdd;border-left:4px solid var(--accent);background:#f3f5fb;border-radius:6px;padding:10px 16px;margin:8px 0 18px}
  #content .learnbox p{margin:0 0 6px;font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
  #content .learnbox ul{margin:0;padding-left:20px}
  #content .learnbox li{margin:0 0 4px}
  /* how-to tables + black-and-white diagrams (Ch10/Ch11) */
  #content table{border-collapse:collapse;width:100%;margin:12px 0 4px;font-family:var(--sans);font-size:13.5px;line-height:1.42}
  #content th,#content td{border:1px solid #333;padding:6px 9px;text-align:left;vertical-align:top}
  #content th{background:#ececec;font-weight:700;color:#111}
  #content tr:nth-child(even) td{background:#fafaf8}
  #content pre.diagram{background:#fff;border:1px solid #333;color:#111}
  #content pre.diagram code{font-size:12.5px;line-height:1.35}
  #content .figcap{font-family:var(--sans);font-size:12.5px;font-style:italic;color:#777;margin:-4px 0 14px}
  /* drawn diagrams (inline SVG) + takeaway note */
  #content .diagramfig{margin:16px 0 6px;text-align:center}
  #content .diagramfig svg{width:100%;height:auto;max-width:680px}
  #content .dgnote{font-family:var(--sans);font-size:12.5px;font-style:italic;color:#555;max-width:560px;margin:8px auto 0;line-height:1.45}
  #content .dgnote b{font-weight:700;font-style:normal;color:#333}
  #content .defbox{position:relative;background:#faf7ef url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2234%22%20height%3D%2234%22%20viewBox%3D%220%200%2034%2034%22%3E%3Ccircle%20cx%3D%2217%22%20cy%3D%2217%22%20r%3D%2216%22%20fill%3D%22%231f2a4a%22/%3E%3Cpath%20d%3D%22M7%2010%20L12%2015%20M27%2010%20L22%2015%22%20stroke%3D%22%23d9b24a%22%20stroke-width%3D%222%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2212.5%22%20cy%3D%2216%22%20r%3D%224.3%22%20fill%3D%22%23faf7ef%22/%3E%3Ccircle%20cx%3D%2221.5%22%20cy%3D%2216%22%20r%3D%224.3%22%20fill%3D%22%23faf7ef%22/%3E%3Ccircle%20cx%3D%2212.5%22%20cy%3D%2216%22%20r%3D%221.8%22%20fill%3D%22%231f2a4a%22/%3E%3Ccircle%20cx%3D%2221.5%22%20cy%3D%2216%22%20r%3D%221.8%22%20fill%3D%22%231f2a4a%22/%3E%3Cpath%20d%3D%22M17%2018%20l2.4%203%20h-4.8%20z%22%20fill%3D%22%23d9b24a%22/%3E%3C/svg%3E") no-repeat 12px 12px;background-size:32px 32px;border:1px solid #e7ddc4;border-radius:0;padding:10px 14px 10px 56px;margin:10px 0 16px}
  #content .defbox::before{content:"Definition";display:block;font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a6d1f;margin-bottom:2px}
  #content .defbox p{margin:0}
  #content .analogy{margin:12px 0 18px;border:1px solid #c7ccdd;background:#f3f5fb;border-radius:0;padding:10px 14px 4px}
  #content .analogy::before{content:"Analogy";display:block;font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  #content .analogy table{margin:4px 0 6px;background:#fff}
  #content .analogy th,#content .analogy td{border:1px solid #c7ccdd}
  #content .analogy th{background:var(--accent);color:#fff}
  #content .analogy td:first-child{background:#eef1f8;color:#333}
  #content .analogy td:nth-child(2){font-weight:600;color:#1b1f3d}
  #content table.scorecard{width:auto;margin:8px auto 2px;border-collapse:collapse;font-size:13px}
  #content table.scorecard caption{font-family:var(--sans);font-weight:700;font-size:14px;color:var(--accent);padding-bottom:6px}
  #content table.scorecard th,#content table.scorecard td{border:1px solid #ddd;padding:5px 10px;text-align:center}
  #content table.scorecard th{background:#f3f3f1;font-size:12.5px}
  #content table.scorecard tr:nth-child(even) td{background:none}
  #content table.scorecard td.dim{text-align:left;font-weight:600;white-space:nowrap}
  #content table.scorecard th.hot,#content table.scorecard td.hot{border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
  #content table.scorecard thead th.hot{border-top:2px solid var(--accent)}
  #content table.scorecard tbody tr:last-child td.hot{border-bottom:2px solid var(--accent)}
  #content .chip{display:inline-block;min-width:54px;padding:2px 0;border-radius:4px;font-size:11.5px;font-weight:700}
  #content .chip.pass{background:#e8f1ea;color:#2f7a4e;border:1px solid #bcdcc8}
  #content .chip.warn{background:#faf0d6;color:#8a6410;border:1px solid #e6d29a}
  #content .chip.fail{background:#f7e2e2;color:#b23b3b;border:1px solid #e3b5b5}
  /* book boxes */
  #content .futurebox{border:1.4px dashed #9aa0b6;background:#f5f6fb;border-radius:6px;padding:10px 14px;margin:14px 0;font-size:14px;line-height:1.5;color:#343a4e}
  #content .futurebox p{margin:0}
  #content .futurebox strong{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#3d4a74}
  #content .epigraph{margin:26px 0 34px 30%;padding-left:14px;border-left:2px solid #c9cde0;color:#3b3f55}
  #content .epigraph p{margin:0 0 2px;font-style:italic;font-size:15.5px;line-height:1.5}
  #content .epigraph p + p{margin-bottom:10px}
  #content .epigraph .by{font-style:normal;font-family:var(--sans);font-size:12.5px;color:#6b6f85;letter-spacing:.02em}
  #content .epigraph .by em{font-style:italic}
  @media (max-width:700px){#content .epigraph{margin-left:12%}}
  #content .copyright{font-size:13px;color:#555;border-top:1px solid #ddd;margin:30px 0;padding-top:12px}
  #content .warbox{border:1px solid #e6b6b6;border-left:4px solid var(--red);background:#fcecec;border-radius:6px;padding:11px 15px;margin:14px 0;font-size:14.5px;line-height:1.52;color:#3a1c1c}
  #content .warbox p{margin:0}
  #content .warbox p + p{margin-top:8px}
  #content .warbox em{font-style:italic}
  #content .warbox strong{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#9a2a2a}
  #content .keyq{margin:18px 0 22px;padding:14px 0;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);
    text-align:center;font-family:var(--sans);font-weight:700;font-size:22px;color:var(--accent)}
  #content .keyq p{margin:0}
  /* cover / toc / pagebreaks for screen */
  #content .cover-page{min-height:auto;display:flex;justify-content:center;padding:8px 0 24px;background:none}
  #content .cover-page img{height:auto;max-height:380px;max-width:100%;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
  #content .pagebreak{display:none}
  #content .booktoc .pg{display:none}
  #content .booktoc .toc-part{display:flex;margin:16px 0 6px;font-family:var(--sans);font-weight:700;color:var(--accent);font-size:16px}
  #content .booktoc .toc-entry{display:flex;gap:10px;margin:3px 0;font-size:16px}
  #content .booktoc .toc-entry .num{color:#8a8a8a;min-width:1.6em}
  #content .booktoc .toc-entry .dots{display:none}
  /* highlights */
  #content .web{color:#5a189a}
  #content mark.hl{background:var(--hl);border-radius:2px;cursor:pointer;padding:.5px 0}
  #content mark.hl.pending{background:#bfe3ff}
  #content mark.hl.active{background:var(--hlActive)}
  #content mark.hl.resolved{background:#eef0ee;color:inherit}
  /* comment cards */
  .card{position:absolute;left:0;width:100%;max-width:280px;background:#fff;border:1px solid var(--line);
        border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:11px 13px;font-family:var(--sans);
        transition:top .12s ease, box-shadow .12s ease}
  .card.active{border-color:var(--accent);box-shadow:0 3px 14px rgba(38,45,101,.18)}
  .card.resolved{opacity:.6}
  .card .q{font-size:12px;color:var(--muted);font-style:italic;border-left:3px solid var(--hlActive);
        padding-left:8px;margin-bottom:7px;max-height:3.2em;overflow:hidden}
  .card .ct{font-size:14px;line-height:1.45;color:#222;white-space:pre-wrap;word-wrap:break-word}
  .card textarea{width:100%;font-family:var(--sans);font-size:14px;line-height:1.45;border:1px solid var(--line);
        border-radius:7px;padding:8px;resize:vertical;min-height:62px;outline:none}
  .card textarea:focus{border-color:var(--accent)}
  .card .meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:#9a9a9a}
  .card .meta .sp{flex:1}
  .card .meta button{font-family:var(--sans);font-size:11.5px;border:none;background:none;color:#8a8a8a;cursor:pointer;padding:2px 4px}
  .card .meta button:hover{color:var(--accent);text-decoration:underline}
  .card .meta button.del:hover{color:var(--red)}
  .card.compose{border-color:#7aa7d8;box-shadow:0 3px 14px rgba(38,45,101,.16)}
  .card.compose .khint{font-size:11px;color:#9a9a9a;margin-top:5px}
  /* sentiment */
  .card.up{border-left:4px solid #2e7d4f}
  .card.down{border-left:4px solid var(--red)}
  .card .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
  .card .badge.up{background:#e4f3ea;color:#2e7d4f}
  .card .badge.down{background:#fbe6e6;color:#a83232}
  .react{display:flex;gap:7px;margin:4px 0 2px}
  .react button{font-family:var(--sans);font-size:13px;line-height:1;border:1px solid var(--line);background:#fff;
       color:var(--ink);padding:6px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .react button:hover{background:#f0f0ec}
  .react button.up:hover{border-color:#2e7d4f;color:#2e7d4f}
  .react button.down:hover{border-color:var(--red);color:var(--red)}
  #content mark.hl.up{background:#cdebd8}
  @media (max-width:1180px){ .doc{grid-template-columns:minmax(0,1fr) 300px} #toc{display:none} }
  @media (max-width:860px){ .doc{grid-template-columns:1fr} #rail{display:none} }
.card .authst{font:600 11.5px var(--sans);margin:-2px 0 6px;padding:3px 7px;background:#e8f6ec;color:#1f7a45;border:1px solid #b9e2c6}
.card .authst.wont_do{background:#f3f3f3;color:#555;border-color:#ddd}
.card.addressed{border-color:#b9e2c6}
#content h1[id],#content h2[id],#content h3[id],#content h4[id]{position:relative;scroll-margin-top:calc(var(--bar,52px) + 14px)}
#content .hanchor{position:absolute;left:-1.05em;top:0;padding-right:.25em;opacity:0;text-decoration:none;color:#8a90b0;font-weight:400;user-select:none;transition:opacity .12s}
#content .hanchor::before{content:"#"}
#content h1:hover>.hanchor,#content h2:hover>.hanchor,#content h3:hover>.hanchor,#content h4:hover>.hanchor,#content .hanchor:focus{opacity:1}
#content .hanchor:hover{color:#262d65}
@media (hover:none){#content .hanchor{opacity:.45}}
#asr-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#262d65;color:#fff;font:600 13px "Source Sans 3",system-ui,sans-serif;padding:8px 14px;opacity:0;pointer-events:none;transition:all .15s;z-index:2000}
#asr-toast.on{opacity:1;transform:translateX(-50%)}
.bar select#ver{font:600 12.5px "Source Sans 3",system-ui,sans-serif;padding:5px 8px;border:1px solid #c7ccdd;background:#fff;color:#262d65;margin-right:8px;cursor:pointer}
  .bar .vernote,.bar select#ver,.bar .auth-user,.bar button{white-space:nowrap}
.bar .vernote{font:600 12px "Source Sans 3",system-ui,sans-serif;background:#fff6dc;color:#8a5a00;border:1px solid #f0d68f;padding:4px 8px;margin-right:8px}
.bar .vernote a{color:#262d65;margin-left:4px}
body.readonly #clearBtn,body.readonly #chpass{display:none}
.card .meta .rtag{font-weight:600;color:#9a9a9a}.card .meta .rtag.on{color:#1f7a45}
#tocbtn{display:none;flex-direction:column;justify-content:center;gap:4px;width:36px;height:34px;padding:0 8px;border:1px solid #d5d8e3;background:#fff;cursor:pointer;flex:none}
#tocbtn span{display:block;height:2px;background:#262d65}
#tocbtn:hover{background:#f3f5fb}
@media (max-width:1180px){
  #tocbtn{display:inline-flex}
  body.tocopen #toc{display:block;position:fixed;left:0;top:var(--tocTop,52px);bottom:0;width:min(330px,86vw);max-height:none;margin:0;
    padding:14px 12px 24px 16px;background:#fff;z-index:45;overflow-y:auto;box-shadow:6px 0 28px rgba(20,24,40,.18);border-right:1px solid #e3e5ea}
  body.tocopen #tocscrim{display:block;position:fixed;left:0;right:0;bottom:0;top:var(--tocTop,52px);background:rgba(20,24,40,.25);z-index:44}
  .bar{gap:10px}
  .bar .auth-user{display:none}
  .bar button{padding-left:10px;padding-right:10px}
}
@media (max-width:860px){
  .bar{gap:8px;padding:8px 10px;flex-wrap:wrap}
  .bar .t{font-size:14px}
  .bar .auth-user,#copyBtn,#toggleResolved,#chpass{display:none}
  .doc{grid-template-columns:minmax(0,1fr)!important;gap:0}
  .wrap{padding:0 8px}
  #content{padding:22px 16px;margin:10px 0;border-radius:0}
  #content pre,#content .sourceCode{overflow-x:auto;max-width:100%}
  #content svg,#content img,#content figure{max-width:100%;height:auto}
  #content table{display:block;overflow-x:auto;max-width:100%}
  #content .hanchor{left:-.8em}
}
.card .cacts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.card .cacts button{font:600 13px var(--sans);border-radius:7px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.card .cacts .csave{background:var(--accent);border-color:var(--accent);color:#fff}
#msheet,#mcbtn{display:none}
@media (max-width:860px){
  #mcbtn:not([hidden]){display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:70;
    font:700 15px var(--sans);color:#fff;background:var(--accent);border:none;border-radius:999px;padding:12px 20px;box-shadow:0 6px 22px rgba(20,24,40,.3)}
  #msheet.open{display:block;position:fixed;left:0;right:0;bottom:0;z-index:65;background:#fff;border-top:1px solid var(--line);border-radius:14px 14px 0 0;
    box-shadow:0 -8px 30px rgba(20,24,40,.18);padding:10px 14px calc(14px + env(safe-area-inset-bottom));max-height:72vh;overflow-y:auto;font-family:var(--sans)}
  #msheet .mshead{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:14px;color:var(--accent)}
  #msheet .msx{border:none;background:#f1f2f6;border-radius:999px;width:32px;height:32px;font-size:15px;cursor:pointer;color:#444}

<body>
<div id="auth-gate" role="dialog" aria-labelledby="auth-title">
  <div class="auth-card">
    <img src="images/book-cover.png" alt="" class="auth-cover">
    <h1 id="auth-title">The Agent Scorecard</h1>
    <p class="auth-sub" id="auth-title-sub"></p>
    <div id="auth-tabs" role="tablist"><button type="button" data-mode="signin">Sign in</button><button type="button" data-mode="signup">Create account</button></div>
    <form id="auth-form">
      <div id="auth-email-row"><label for="auth-email">Email</label>
      <input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
      <div id="auth-pass-row"><label for="auth-pass">Password</label>
      <input id="auth-pass" type="password" minlength="8"></div>
      <div id="auth-pass2-row" hidden><label for="auth-pass2">Confirm password</label>
      <input id="auth-pass2" type="password" autocomplete="new-password" minlength="8"></div>
      <button id="auth-submit" type="submit">Sign in</button>
    </form>
    <a href="#" id="auth-forgot" class="auth-link">Forgot password?</a> <a href="#" id="auth-cancel" class="auth-link" hidden>Back to the book</a>
    <p id="auth-msg" class="auth-msg" aria-live="polite"></p>
    <p class="auth-fine">Your comments are saved to your account, so you see them again from any browser.</p>
  </div>
</div>

  <div class="bar">
    <button id="tocbtn" type="button" aria-label="Open contents" aria-expanded="false" aria-controls="toc"><span></span><span></span><span></span></button>
    <span class="t">The Agent Scorecard — Review</span>
    <span class="count" id="count">0 comments</span>
    <span class="sp"></span>
    <span id="vernote" class="vernote" hidden></span><span id="ver" class="vermenu" hidden></span><span id="sync-status" class="sync-status"></span><span id="auth-user" class="auth-user"></span><button id="chpass">Change password</button><button id="signout">Sign out</button>
    <button id="toggleResolved">Hide resolved</button>
    <button id="copyBtn">Copy all</button>
    
    <button id="clearBtn">Clear</button>
  </div>
  <div class="wrap">
    <div class="doc">
      <div id="tocscrim" hidden></div>
      <nav id="toc" aria-label="Table of contents"></nav>
      <div id="content"></div>
      <div id="rail"></div>
    </div>

<script>
window.ASR_BOOT=function(){
  const LS_KEY=(window.ASR_USER?window.ASR_USER.id+'_':'')+'asr_comments_v40';
  const DRAFT='v40';
  const DOWN_DEFAULT='This makes no sense, elaborate more with context and background. Make it easier to read, dont assume anything.';
  const content=document.getElementById('content');
  const narrow=()=>window.matchMedia('(max-width:860px)').matches;
  const rail=document.getElementById('rail');
  const countEl=document.getElementById('count');
  let comments=[]; let compose=null; let activeId=null; let hideResolved=false;

  const uid=()=> 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(comments));}catch(e){} if(window.ASR_SYNC) window.ASR_SYNC(comments); }
  function load(){ comments=Array.isArray(window.ASR_INITIAL)?window.ASR_INITIAL.slice():[]; }

  // ---- seed comments from an exported JSON (injected by build_review.py) ----
  const SEED_OBJ={"draft":null,"comments":[]};
  const SEED=(SEED_OBJ.draft===DRAFT&&Array.isArray(SEED_OBJ.comments))?SEED_OBJ.comments:[];
  function buildIndex(){
    let s='',map=[],prev=null,sp=true;
    const w=document.createTreeWalker(content,NodeFilter.SHOW_TEXT); let n;
    while((n=w.nextNode())){
      const b=blockOf(n); if(!b) continue;
      if(b!==prev){ if(!sp){ s+=' '; map.push(null); sp=true; } prev=b; }
      const v=n.nodeValue;
      for(let i=0;i<v.length;i++){
        if(/\s/.test(v[i])){ if(sp) continue; s+=' '; map.push([n,i]); sp=true; }
        else { s+=v[i]; map.push([n,i]); sp=false; }
      }
    }
    return {s,map};
  }
  const nzq=x=>(x||'').replace(/\s+/g,' ').trim();
  function anchoredText(c){
    const sb=blockByBid(c.sBid); if(!sb) return null;
    const eb=c.eBid?blockByBid(c.eBid):sb; if(!eb) return null;
    const sp=pointFromGlobal(sb,c.sOff), ep=pointFromGlobal(eb,c.eOff); if(!sp||!ep) return null;
    try{ const r=document.createRange(); r.setStart(sp.node,sp.offset); r.setEnd(ep.node,ep.offset); return r.toString(); }catch(e){ return null; }
  }
  function reanchorAll(list){
    let changed=false, idx=null;
    for(const c of list){
      const q=nzq(c.quote); if(!q) continue;
      if(nzq(anchoredText(c))===q){ if(c.textChanged){ delete c.textChanged; changed=true; } continue; }
      idx=idx||buildIndex();
      let from=0; const ch=nzq(c.chapter); if(ch){ const k=idx.s.indexOf(ch); if(k>=0) from=k; }
      let i=idx.s.indexOf(q,from); if(i<0) i=idx.s.indexOf(q);
      const a=i>=0?idx.map[i]:null, z=i>=0?idx.map[i+q.length-1]:null;
      if(!a||!z){ if(!c.textChanged){ c.textChanged=true; changed=true; } continue; }
      const sb=blockOf(a[0]), eb=blockOf(z[0]);
      Object.assign(c,{sBid:sb.dataset.bid,sOff:globalOffset(sb,a[0],a[1]),eBid:(eb!==sb)?eb.dataset.bid:null,eOff:globalOffset(eb,z[0],z[1]+1)});
      delete c.textChanged; changed=true;
    }
    return changed;
  }
  window.ASR_APP={reanchor:(list)=>{ const copy=JSON.parse(JSON.stringify(list)); unwrapAll(); assignBids(); reanchorAll(copy); renderAll(); return copy; }};
  function seedComments(){
    if(!SEED.length) return;
    const SK=LS_KEY+'_seeded'; let done=[];
    try{ done=JSON.parse(localStorage.getItem(SK)||'[]'); }catch(e){}
    const have=new Set(comments.map(c=>c.id)); const idx=buildIndex(); const nz=x=>(x||'').replace(/\s+/g,' ').trim();
    let added=0, missed=[];
    for(const sd of SEED){
      if(have.has(sd.id)||done.includes(sd.id)) continue;
      const q=nz(sd.quote); if(!q){ continue; }
      let from=0; const ch=nz(sd.chapter); if(ch){ const k=idx.s.indexOf(ch); if(k>=0) from=k; }
      let i=idx.s.indexOf(q,from); if(i<0) i=idx.s.indexOf(q);
      if(i<0){ missed.push(sd.quote.slice(0,40)); continue; }
      let a=idx.map[i], z=idx.map[i+q.length-1];
      if(!a||!z){ missed.push(sd.quote.slice(0,40)); continue; }
      const sb=blockOf(a[0]), eb=blockOf(z[0]);
      comments.push({id:sd.id,sBid:sb.dataset.bid,sOff:globalOffset(sb,a[0],a[1]),
        eBid:(eb!==sb)?eb.dataset.bid:null,eOff:globalOffset(eb,z[0],z[1]+1),
        quote:sd.quote,chapter:sd.chapter,text:sd.comment||'',sentiment:sd.sentiment||null,
        created:Date.parse(sd.created)||Date.now(),resolved:!!sd.resolved});
      done.push(sd.id); added++;
    }
    try{ localStorage.setItem(SK,JSON.stringify(done)); }catch(e){}
    if(added) save();
    if(missed.length) console.warn('seed: could not place',missed.length,'comment(s):',missed);
    console.log('seed: added',added,'comment(s)');
  }

  function assignBids(){
    const sel='p,li,h1,h2,h3,h4,blockquote,pre,.futurebox,.warbox,.toc-entry,.toc-part';
    content.querySelectorAll(sel).forEach((b,i)=>{ if(!b.dataset.bid) b.dataset.bid='b'+i; });
  }
  const blockByBid=(bid)=> content.querySelector('[data-bid="'+bid+'"]');

  function blockOf(node){
    let el=node.nodeType===3?node.parentNode:node;
    while(el&&el!==content&&!(el.dataset&&el.dataset.bid)) el=el.parentNode;
    return (el&&el.dataset&&el.dataset.bid)?el:null;
  }
  function globalOffset(container,node,offset){
    let total=0; const w=document.createTreeWalker(container,NodeFilter.SHOW_TEXT); let n;
    while((n=w.nextNode())){ if(n===node) return total+offset; total+=n.nodeValue.length; }
    return total;
  }
  function pointFromGlobal(container,goff){
    let total=0; const w=document.createTreeWalker(container,NodeFilter.SHOW_TEXT); let n,last=null;
    while((n=w.nextNode())){ last=n; if(total+n.nodeValue.length>=goff) return {node:n,offset:goff-total}; total+=n.nodeValue.length; }
    return last?{node:last,offset:last.nodeValue.length}:null;
  }
  function chapterOf(block){
    let head=''; const blocks=content.querySelectorAll('[data-bid]');
    for(const b of blocks){ if(/^H[1-4]$/.test(b.tagName)) head=b.textContent.trim(); if(b===block) break; }
    return head;
  }
  function wrapRange(range,cid,cls){
    let root=range.commonAncestorContainer; if(root.nodeType===3) root=root.parentNode;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:(n)=> range.intersectsNode(n)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
    const nodes=[]; let n; while((n=w.nextNode())) nodes.push(n);
    nodes.forEach(node=>{
      let from=(node===range.startContainer)?range.startOffset:0;
      let to=(node===range.endContainer)?range.endOffset:node.nodeValue.length;
      if(from>=to) return;
      const r=document.createRange(); r.setStart(node,from); r.setEnd(node,to);
      const m=document.createElement('mark'); m.className='hl'+(cls?(' '+cls):''); m.dataset.cid=cid;
      try{ r.surroundContents(m);}catch(e){}
    });
  }
  function unwrapAll(){
    content.querySelectorAll('mark.hl').forEach(m=>{ const p=m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild,m); p.removeChild(m); });
    content.querySelectorAll('[data-bid]').forEach(b=> b.normalize());
  }
  function rewrap(){
    comments.forEach(c=>{
      if(hideResolved&&c.resolved) return;
      const sb=blockByBid(c.sBid); if(!sb) return;
      const eb=c.eBid?blockByBid(c.eBid):sb; if(!eb) return;
      const sp=pointFromGlobal(sb,c.sOff), ep=pointFromGlobal(eb,c.eOff);
      if(!sp||!ep) return;
      const r=document.createRange();
      const cls=c.resolved?'resolved':(c.sentiment==='up'?'up':'');
      try{ r.setStart(sp.node,sp.offset); r.setEnd(ep.node,ep.offset); wrapRange(r,c.id, cls); }catch(e){}
    });
    // keep the selection you are commenting on highlighted while you type (pending)
    if(compose){
      const sb=blockByBid(compose.sBid);
      const eb=compose.eBid?blockByBid(compose.eBid):sb;
      if(sb&&eb){
        const sp=pointFromGlobal(sb,compose.sOff), ep=pointFromGlobal(eb,compose.eOff);
        if(sp&&ep){ const r=document.createRange(); try{ r.setStart(sp.node,sp.offset); r.setEnd(ep.node,ep.offset); wrapRange(r,'__compose__','pending'); }catch(e){} }
      }
    }
  }

  function fmtTime(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }

  function buildCard(c){
    const card=document.createElement('div'); card.className='card'+(c.resolved?' resolved':'')+(c.sentiment?(' '+c.sentiment):'')+(c.id===activeId?' active':'');
    card.dataset.cid=c.id;
    const q=document.createElement('div'); q.className='q'; q.textContent=c.quote.length>140?c.quote.slice(0,140)+'…':c.quote;
    const ct=document.createElement('div'); ct.className='ct';
    if(c.sentiment){ const bd=document.createElement('span'); bd.className='badge '+c.sentiment; bd.textContent=c.sentiment==='up'?'👍 explore later':'👎 needs work'; ct.appendChild(bd); }
    ct.appendChild(document.createTextNode(c.text||''));
    const meta=document.createElement('div'); meta.className='meta';
    meta.innerHTML='<span>'+fmtTime(c.created)+'</span><span class="sp"></span>';
    const edit=document.createElement('button'); edit.textContent='Edit';
    const res=document.createElement('button'); res.textContent=c.resolved?'Reopen':'Resolve';
    const del=document.createElement('button'); del.className='del'; del.textContent='Delete';
    if(!window.ASR_READONLY){ meta.appendChild(edit); meta.appendChild(res); meta.appendChild(del); }
    else { const rt=document.createElement('span'); rt.className='rtag'+(c.resolved?' on':''); rt.textContent=c.resolved?'Resolved':'Open'; meta.appendChild(rt); }
    card.appendChild(q); card.appendChild(ct); card.appendChild(meta);
    const st=window.ASR_STATUS&&window.ASR_STATUS[c.id];
    if(c.textChanged){ const tc=document.createElement('div'); tc.className='authst wont_do'; tc.textContent='Text changed since this comment: quote not found'; card.insertBefore(tc,q); }
    if(st&&st.status!=='open'){ const sb=document.createElement('div'); sb.className='authst '+st.status;
      sb.textContent={done:'✓ Done',incorporated:'✓ Incorporated',wont_do:'Not changed'}[st.status]+(st.draft?' in '+st.draft:'')+(st.note?': '+st.note:'');
      card.insertBefore(sb,q); card.classList.add('addressed'); }
    card.addEventListener('click',(e)=>{ if(e.target.tagName==='BUTTON')return; focusComment(c.id,true); });
    edit.addEventListener('click',(e)=>{ e.stopPropagation(); startEdit(card,c); });
    res.addEventListener('click',(e)=>{ e.stopPropagation(); c.resolved=!c.resolved; save(); renderAll(); });
    del.addEventListener('click',(e)=>{ e.stopPropagation(); comments=comments.filter(x=>x.id!==c.id); save(); renderAll(); });
    return card;
  }
  function startEdit(card,c){
    card.querySelector('.ct').remove();
    const ta=document.createElement('textarea'); ta.value=c.text;
    card.insertBefore(ta,card.querySelector('.meta'));
    ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
    ta.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); c.text=ta.value.trim()||c.text; save(); renderAll(); } if(e.key==='Escape'){ renderAll(); } });
  }
  function buildCompose(){
    const card=document.createElement('div'); card.className='card compose';
    const q=document.createElement('div'); q.className='q'; q.textContent=compose.quote.length>140?compose.quote.slice(0,140)+'…':compose.quote;

  });
  function friendly(m) {
    if (/invalid login credentials/i.test(m)) return 'Wrong email or password. New here? Use "Create account".';
    if (/rate limit/i.test(m)) return 'Too many emails sent in the last hour. Please try again later.';
    return m;
  }

  async function start(session) {
    if (!session || booted || recovering) return;
    booted = true;
    // a saved session can outlive its account (or be revoked): confirm it with the server first
    const me = await sb.auth.getUser();
    if (me.error || !me.data.user) { booted = false; await sb.auth.signOut({ scope: 'local' }); gate.classList.remove('loading'); gate.classList.add('ready'); return say('Your session has ended. Please sign in again.', 'err'); }
    user = me.data.user;
    gate.classList.add('loading'); say('Loading the book…');
    // which version? latest by default, ?v=v37 opens an older one read-only
    const vers = await sb.from('book_pages').select('draft,published_at,summary').eq('slug', C.slug).order('published_at', { ascending: false });
    const list = vers.error ? [] : vers.data.map((r) => r.draft);
    VERINFO = vers.error ? {} : Object.fromEntries(vers.data.map((r) => [r.draft, r]));
    const asked = new URLSearchParams(location.search).get('v');
    VIEW = asked && list.includes(asked) ? asked : C.draft;
    const readonly = VIEW !== C.draft;
    const [page, rows] = await Promise.all([
      sb.from('book_pages').select('html,draft').eq('slug', C.slug).eq('draft', VIEW).single(),
      sb.from('review_comments').select('id,data,status,status_note,status_draft').eq('draft', VIEW),
    ]);
    if (page.error) { booted = false; gate.classList.remove('loading'); return say('Could not load the book: ' + page.error.message, 'err'); }
    if (rows.error) { booted = false; gate.classList.remove('loading'); return say('Could not load your comments: ' + rows.error.message, 'err'); }
    $('content').innerHTML = page.data.html;
    window.ASR_USER = { id: user.id, email: user.email };
    // Recover comments that this browser saved locally but never reached the server (e.g. a failed save).
    const server = rows.data.map((r) => r.data), have = new Set(server.map((c) => c.id));
    let local = [];
    try { local = JSON.parse(localStorage.getItem(user.id + '_asr_comments_' + VIEW) || '[]'); } catch (e) {}
    const gone = new Set(JSON.parse(localStorage.getItem(user.id + '_asr_deleted_' + VIEW) || '[]'));
    const recovered = readonly ? [] : local.filter((c) => c && c.id && typeof c.quote === 'string' && c.sBid && !have.has(c.id) && !gone.has(c.id));
    window.ASR_INITIAL = server.concat(recovered);
    window.ASR_STATUS = Object.fromEntries(rows.data.map((r) => [r.id, { status: r.status, note: r.status_note, draft: r.status_draft }]));
    rows.data.forEach((r) => synced.set(r.id, JSON.stringify(r.data)));
    window.ASR_READONLY = readonly;
    window.ASR_SYNC = readonly ? () => {} : queue;
    document.body.classList.toggle('readonly', readonly);
    versionMenu(list, readonly);
    $('auth-user').textContent = user.email;
    document.body.classList.add('authed');
    window.ASR_BOOT();
    if (recovered.length) { queue(window.ASR_INITIAL); status('Uploading ' + recovered.length + ' unsaved comment(s)…'); }
    const t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t) setTimeout(() => t.scrollIntoView({ block: 'start' }), 200);
  }

  // Version menu: a popover listing every version with its date, summary and comments per reviewer (live counts).
  let VLIST = [], COUNTS = {}, countTimer = null;
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const initials = (n) => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
  const hue = (n) => { let h = 0; for (const ch of n || '') h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
  const when = (d) => { try { return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return ''; } };
  function versionMenu(list, readonly) {
    const box = $('ver'), note = $('vernote');
    if (!list.includes(C.draft)) list = [C.draft].concat(list);
    VLIST = list;
    box.innerHTML = `<button type="button" class="vm-btn" aria-haspopup="listbox" aria-expanded="false"><span class="vm-dot${readonly ? ' old' : ''}"></span><span class="vm-cur"></span><span class="vm-n" title="Comments on this version"></span><svg class="vm-car" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="vm-pop" role="listbox" hidden></div>`;
    box.hidden = false;
    const btn = box.querySelector('.vm-btn'), pop = box.querySelector('.vm-pop');
    const close = () => { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
    btn.onclick = (e) => { e.stopPropagation(); const open = pop.hidden; if (open) { renderPop(); loadCounts(); } pop.hidden = !open; btn.setAttribute('aria-expanded', String(open)); };
    document.addEventListener('click', (e) => { if (!box.contains(e.target)) close(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    pop.addEventListener('click', (e) => {
      const it = e.target.closest('.vm-item'); if (!it) return;
      if (it.dataset.v === VIEW) return close();
      const u = new URL(location.href); if (it.dataset.v === C.draft) u.searchParams.delete('v'); else u.searchParams.set('v', it.dataset.v); location.href = u.toString();
    });
    renderBtn();
    note.hidden = !readonly;
    if (readonly) { note.textContent = 'Read-only'; note.title = 'Older version: comments are frozen as they were.'; const a = document.createElement('a'); a.href = location.pathname + location.hash; a.textContent = 'Latest →'; note.appendChild(a); }
    loadCounts();
    clearInterval(countTimer); countTimer = setInterval(() => { if (!document.hidden) loadCounts(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCounts(); });
  }
  async function loadCounts() {
    const r = await sb.rpc('version_comment_counts', { p_slug: C.slug });
    if (r.error) return;
    const c = {};
    r.data.forEach((x) => { (c[x.draft] = c[x.draft] || []).push(x); });
    Object.values(c).forEach((a) => a.sort((p, q) => (q.is_me - p.is_me) || (q.total - p.total) || p.reviewer.localeCompare(q.reviewer)));
    COUNTS = c; renderBtn(); if (window.ASR_COUNT) window.ASR_COUNT();
    const pop = document.querySelector('#ver .vm-pop'); if (pop && !pop.hidden) renderPop();
  }
  const sum = (d, k) => (COUNTS[d] || []).reduce((n, x) => n + x[k], 0);
  // Top-bar count: everyone's comments on this version. Mine come from the page (instant), others from the server.
  let MINE = null;
  window.ASR_COUNT = (mine) => {
    if (typeof mine === 'number') MINE = mine;
    const el = $('count'); if (!el || MINE == null) return;
    const people = COUNTS[VIEW] || [];
    const others = people.filter((p) => !p.is_me), oth = others.reduce((n, p) => n + p.total, 0);
    const all = MINE + oth, who = others.length + (MINE ? 1 : 0);
    el.textContent = all + (all === 1 ? ' comment' : ' comments') + (who > 1 || (who === 1 && !MINE) ? ` · ${who} ${who === 1 ? 'person' : 'people'}` : '');
    el.title = (MINE ? `Yours: ${MINE}` : 'Yours: 0') + (others.length ? '\n' + others.map((p) => `${p.reviewer}: ${p.total}${p.open ? ` (${p.open} open)` : ''}`).join('\n') : '') + '\nOnly your own comments show in the margin.';
  };
  function renderBtn() {
    const b = document.querySelector('#ver .vm-btn'); if (!b) return;
    b.querySelector('.vm-cur').textContent = 'Version ' + VIEW + (VIEW === C.draft ? ' (latest)' : '');
    const n = sum(VIEW, 'total'), o = sum(VIEW, 'open');
    const el = b.querySelector('.vm-n'); el.textContent = n ? (o ? o + ' open' : n + (n === 1 ? ' comment' : ' comments')) : ''; el.hidden = !n; el.classList.toggle('open', !!o);
  }
  function renderPop() {
    const pop = document.querySelector('#ver .vm-pop'); if (!pop) return;
    pop.innerHTML = '<div class="vm-head">Versions</div>' + VLIST.map((d) => {
      const info = VERINFO[d] || {}, people = COUNTS[d] || [], tot = sum(d, 'total'), op = sum(d, 'open');
      const rows = people.length ? people.map((p) => `<div class="vm-person"><span class="vm-av" style="--h:${hue(p.reviewer)}">${esc(initials(p.reviewer))}</span><span class="vm-name">${esc(p.reviewer)}${p.is_me ? ' <i>you</i>' : ''}</span><span class="vm-pill${p.open ? ' open' : ''}" title="${p.open} open of ${p.total}">${p.open ? p.open + ' open · ' : ''}${p.total}</span></div>`).join('')
        : '<div class="vm-empty">No comments yet</div>';
      return `<div class="vm-item${d === VIEW ? ' on' : ''}" role="option" aria-selected="${d === VIEW}" data-v="${esc(d)}" tabindex="0">
        <div class="vm-top"><span class="vm-check">${d === VIEW ? '✓' : ''}</span><span class="vm-v">Version ${esc(d)}</span>${d === C.draft ? '<span class="vm-tag latest">Latest</span>' : '<span class="vm-tag">Read-only</span>'}<span class="vm-tot">${tot ? (op ? `<b>${op}</b> open · ` : '') + tot + ' comment' + (tot === 1 ? '' : 's') : ''}</span></div>
        ${info.published_at ? `<div class="vm-date">Published ${esc(when(info.published_at))}</div>` : ''}
        ${info.summary ? `<div class="vm-sum">${esc(info.summary)}</div>` : ''}
        <div class="vm-people">${rows}</div></div>`;
    }).join('') + '<div class="vm-foot"><span class="vm-live"></span>Live: counts refresh every 30 s</div>';
  }

  // Debounced diff sync: upsert changed comments, delete removed ones.
  function queue(comments) { pending = comments.map((c) => ({ ...c })); clearTimeout(timer); timer = setTimeout(flush, 600); status('Saving…'); }
  async function flush() {
    const list = pending; pending = null; if (!list) return;
    const now = new Map(list.map((c) => [c.id, JSON.stringify(c)]));
    const up = list.filter((c) => synced.get(c.id) !== now.get(c.id))
      .map((c) => ({ id: c.id, draft: VIEW, data: c, updated_at: new Date().toISOString() }));
    const gone = [...synced.keys()].filter((id) => !now.has(id));
    if (gone.length) { try { const k = user.id + '_asr_deleted_' + VIEW; localStorage.setItem(k, JSON.stringify([...new Set(JSON.parse(localStorage.getItem(k) || '[]').concat(gone))])); } catch (e) {} }
    let err = null;
    if (up.length) { const r = await sb.from('review_comments').upsert(up, { onConflict: 'user_id,id' }); err = err || r.error; }
    if (gone.length) { const r = await sb.from('review_comments').delete().eq('draft', VIEW).in('id', gone); err = err || r.error; }
    if (err) { console.error('comment save failed', err); status('⚠ Not saved (will retry): ' + err.message, true); pending = pending || list; clearTimeout(timer); timer = setTimeout(flush, 5000); return; }
    synced = now; status('Saved'); loadCounts();
  }
  function status(t, bad) { const el = $('sync-status'); if (el) { el.textContent = t; el.style.color = bad ? '#b42318' : ''; } }
  window.addEventListener('beforeunload', (e) => { if (pending) { flush(); e.preventDefault(); } });

  $('chpass').addEventListener('click', () => { $('auth-pass').value = $('auth-pass2').value = ''; setMode('newpass'); document.body.classList.remove('authed'); gate.classList.remove('loading'); });
  $('auth-cancel').addEventListener('click', (e) => { e.preventDefault(); document.body.classList.add('authed'); setMode('signin'); });
  $('signout').addEventListener('click', async () => {
    if (pending) await flush();
    await sb.auth.signOut();
    location.replace(redirectTo());
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; setMode('newpass'); return; }
    if (session) start(session);
    else if (booted) location.replace(redirectTo());
  });
  setMode(recovering ? 'newpass' : 'signin');
  sb.auth.getSession().then(({ data }) => { if (data.session) start(data.session); else gate.classList.add('ready'); });
})();
</script>
</body>
</html>
